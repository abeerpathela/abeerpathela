<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Isometric 3D coding lab">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2a30"/><stop offset="100%" stop-color="#071418"/>
    </linearGradient>
    <linearGradient id="monTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2ee6a8"/><stop offset="100%" stop-color="#0f6b55"/>
    </linearGradient>
    <linearGradient id="deskT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a2a1c"/><stop offset="100%" stop-color="#1c140e"/>
    </linearGradient>
    <linearGradient id="kb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a3038"/><stop offset="100%" stop-color="#0f1c22"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="420" rx="16" fill="#050d12"/>
  <ellipse cx="500" cy="340" rx="340" ry="48" fill="#0a1c22" opacity="0.9"/>

  <!-- isometric room floor -->
  <g opacity="0.9">
    <polygon points="500,120 820,220 500,320 180,220" fill="url(#floor)" stroke="#1f5a52" stroke-width="1"/>
    <g stroke="#2ee6a8" stroke-opacity="0.15" stroke-width="1">
      <path d="M500,120 L500,320"/>
      <path d="M340,170 L660,270"/>
      <path d="M260,195 L740,245"/>
      <path d="M420,145 L580,295"/>
      <path d="M580,145 L420,295"/>
      <path d="M660,170 L340,270"/>
      <path d="M740,195 L260,245"/>
    </g>
  </g>

  <!-- floating cubes above room -->
  <g>
    <g transform="translate(220,60)">
      <animateTransform attributeName="transform" type="translate" values="220,60;220,45;220,60" dur="3.5s" repeatCount="indefinite"/>
      <polygon points="30,5 55,18 30,31 5,18" fill="#7dffd4"/>
      <polygon points="5,18 30,31 30,55 5,42" fill="#0f4f42"/>
      <polygon points="30,31 55,18 55,42 30,55" fill="#149e82"/>
    </g>
    <g transform="translate(760,70)">
      <animateTransform attributeName="transform" type="translate" values="760,70;760,52;760,70" dur="4.2s" repeatCount="indefinite"/>
      <polygon points="0,-20 18,8 0,2" fill="#ffd27a"/>
      <polygon points="0,-20 -18,8 0,2" fill="#c47a2e"/>
      <polygon points="-18,8 18,8 0,2" fill="#8a4f16"/>
    </g>
    <g transform="translate(820,150)">
      <animateTransform attributeName="transform" type="translate" values="820,150;835,138;820,150" dur="5s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="14" fill="#134855"/>
      <ellipse cx="-3" cy="-4" rx="8" ry="6" fill="#8ef7ff" opacity="0.9"/>
    </g>
  </g>

  <!-- desk -->
  <g transform="translate(500,210)">
    <polygon points="-140,20 140,20 110,70 -110,70" fill="url(#deskT)"/>
    <polygon points="-140,20 -110,70 -110,85 -140,35" fill="#120e0a"/>
    <polygon points="140,20 110,70 110,85 140,35" fill="#24180f"/>
    <!-- legs -->
    <rect x="-95" y="70" width="10" height="40" fill="#1a120c" transform="skewX(-20)"/>
    <rect x="75" y="70" width="10" height="40" fill="#1a120c" transform="skewX(-20)"/>
  </g>

  <!-- monitor -->
  <g transform="translate(500,145)">
    <animateTransform attributeName="transform" additive="sum" type="translate" values="0,0;0,-3;0,0" dur="4s" repeatCount="indefinite"/>
    <polygon points="-70,10 70,10 55,70 -55,70" fill="#0a161c" stroke="#2ee6a8" stroke-width="1.5"/>
    <polygon points="-60,18 60,18 48,62 -48,62" fill="#071218"/>
    <!-- code lines -->
    <g font-family="Consolas, monospace" font-size="8" fill="#2ee6a8">
      <text x="-42" y="32">const dream = build();</text>
      <text x="-42" y="44" fill="#ffd27a">await ship(dream);</text>
      <text x="-42" y="56" fill="#8ef7ff">return impact;</text>
    </g>
    <rect x="-8" y="70" width="16" height="18" fill="#0e1c22"/>
    <polygon points="-28,88 28,88 22,96 -22,96" fill="#142428"/>
  </g>

  <!-- keyboard -->
  <g transform="translate(500,250)">
    <polygon points="-55,0 55,0 45,18 -45,18" fill="url(#kb)" stroke="#1f5a52"/>
    <g fill="#2ee6a8" opacity="0.55">
      <rect x="-40" y="4" width="6" height="4" rx="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="-30" y="4" width="6" height="4" rx="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.2s" repeatCount="indefinite"/></rect>
      <rect x="-20" y="4" width="6" height="4" rx="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" begin="0.4s" repeatCount="indefinite"/></rect>
      <rect x="-10" y="4" width="6" height="4" rx="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" begin="0.1s" repeatCount="indefinite"/></rect>
      <rect x="0" y="4" width="6" height="4" rx="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" begin="0.3s" repeatCount="indefinite"/></rect>
      <rect x="10" y="4" width="6" height="4" rx="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.5s" repeatCount="indefinite"/></rect>
      <rect x="20" y="4" width="6" height="4" rx="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" begin="0.15s" repeatCount="indefinite"/></rect>
      <rect x="30" y="4" width="6" height="4" rx="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" begin="0.35s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- coffee mug (cylinder) -->
  <g transform="translate(610,235)">
    <animateTransform attributeName="transform" type="translate" values="610,235;610,230;610,235" dur="3s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="18" rx="12" ry="5" fill="#5a3a22"/>
    <rect x="-12" y="0" width="24" height="18" fill="#7a5230"/>
    <ellipse cx="0" cy="0" rx="12" ry="5" fill="#c48a55"/>
    <path d="M12,4 Q22,9 12,14" fill="none" stroke="#c48a55" stroke-width="3"/>
    <!-- steam -->
    <path d="M-4,-4 C-6,-14 -2,-18 -4,-26" fill="none" stroke="#9fd6cb" stroke-width="1.5" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M4,-4 C2,-12 6,-18 4,-24" fill="none" stroke="#9fd6cb" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- stacked books -->
  <g transform="translate(380,245)">
    <polygon points="-30,0 30,0 24,12 -36,12" fill="#1f6f7a"/>
    <polygon points="-30,-10 30,-10 30,0 -30,0" fill="#2aa8b8"/>
    <polygon points="-34,-20 26,-20 30,-10 -30,-10" fill="#d98a35"/>
  </g>

  <text x="500" y="395" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9fd6cb" letter-spacing="2">
    ISOMETRIC LAB  |  WHERE CODE BECOMES FORM
  </text>
</svg>
