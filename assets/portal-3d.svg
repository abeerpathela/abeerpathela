<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="3D portal with floating shapes">
  <defs>
    <radialGradient id="void" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16343c"/>
      <stop offset="60%" stop-color="#0a1a20"/>
      <stop offset="100%" stop-color="#050d12"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafff7" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#2ee6a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050d12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#void)"/>

  <!-- portal rings -->
  <g transform="translate(450,150)">
    <ellipse cx="0" cy="0" rx="40" ry="90" fill="url(#core)">
      <animate attributeName="rx" values="30;55;30" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="55" ry="110" fill="none" stroke="#2ee6a8" stroke-width="2" opacity="0.7">
      <animate attributeName="rx" values="45;70;45" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="80" ry="130" fill="none" stroke="#ffd27a" stroke-width="1.5" opacity="0.5">
      <animate attributeName="rx" values="70;95;70" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="110" ry="145" fill="none" stroke="#8ef7ff" stroke-width="1" opacity="0.35">
      <animate attributeName="rx" values="100;125;100" dur="5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- shapes being pulled into portal -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="120,80;400,140;120,80" dur="6s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;0.3;1" dur="6s" repeatCount="indefinite"/>
      <polygon points="20,0 40,12 20,24 0,12" fill="#7dffd4"/>
      <polygon points="0,12 20,24 20,44 0,32" fill="#0f4f42"/>
      <polygon points="20,24 40,12 40,32 20,44" fill="#149e82"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="780,70;500,145;780,70" dur="7s" begin="1s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;0.25;1" dur="7s" begin="1s" repeatCount="indefinite"/>
      <polygon points="0,-18 16,10 0,4" fill="#ffd27a"/>
      <polygon points="0,-18 -16,10 0,4" fill="#c47a2e"/>
      <polygon points="-16,10 16,10 0,4" fill="#8a4f16"/>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="150,220;410,160;150,220" dur="5.5s" begin="0.5s" repeatCount="indefinite"/>
    <circle r="12" fill="#134855">
      <animate attributeName="r" values="12;4;12" dur="5.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <ellipse cx="-3" cy="-3" rx="7" ry="5" fill="#8ef7ff" opacity="0.85"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="760,220;490,165;760,220" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
    <polygon points="0,-14 12,0 0,14 -12,0" fill="#ff9e7a">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <text x="450" y="275" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9fd6cb" letter-spacing="3">
    DIMENSIONAL PORTAL · IDEAS ENTER · PRODUCTS EXIT
  </text>
</svg>
